<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | João Pinheiro - Engenharia de Software</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="#home">Início</a></li>
            <li><a href="#projects">Projetos</a></li>
            <li><a href="#skills">Habilidades</a></li>
            <li><a href="#contact">Contato</a></li>
        </ul>
    </nav>
    <div class="language-switcher">
        <button onclick="">PT</button>
        <button onclick="">EN</button>
    </div>
</header>

<main>
    <section id="home">
        <h1 id="txt-greeting">Olá, eu sou o João Lucas</h1>
        <p id="txt-intro">Estudante de Engenharia de Software e Desenvolvedor Full Stack.</p>
        <div class="profile-banner"></div>
    </section>

    <section id="projects">
        <h2 id="txt-projects-title">Meus Projetos</h2>
        <div id="project-list" class="grid-container">
        </div>
    </section>

    <section id="skills">
        <h2 id="txt-skills-title">Habilidades Técnicas</h2>
        <ul id="skills-list">
        </ul>
    </section>

    <section id="contact">
        <h2 id="txt-contact-title">Contato</h2>
        <form id="contact-form">
            <label for="name" id="label-name">Nome</label>
            <input type="text" id="name" name="name" placeholder="Seu Nome" required>

            <label for="email" id="label-email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Seu E-mail" required>

            <label for="message" id="label-message">Mensagem</label>
            <textarea id="message" name="message" placeholder="Sua Mensagem"></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 - João Lucas Pinheiro | Engenharia de Software IFPR</p>
    <div id="api-content"></div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
