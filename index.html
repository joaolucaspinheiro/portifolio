<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | João Pinheiro - Engenharia de Software</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="#home" data-i18n="navHome">Início</a></li>
            <li><a href="#projects" data-i18n="navProjects">Projetos</a></li>
            <li><a href="#skills" data-i18n="navSkills">Habilidades</a></li>
            <li><a href="#contact" data-i18n="navContact">Contato</a></li>
        </ul>
    </nav>
    <div class="language-switcher">
        <span class="lang-icon"></span>
        <div class="lang-options">
            <button>PT</button>
            <button>EN</button>
        </div>
    </div>
</header>

<main>
    <section id="home">
        <h1 data-i18n="greeting">Olá, eu sou o João Lucas</h1>
        <p data-i18n="intro">Estudante de Engenharia de Software e Desenvolvedor Full Stack.</p>
        <div class="profile-banner"></div>
    </section>

    <section id="projects">
        <h2 data-i18n="projectsTitle">Meus Projetos</h2>
        <div class="grid-container">
            <div id="project-list"></div>
        </div>
    </section>

    <section id="skills">
        <h2 data-i18n="skillsTitle">Habilidades Técnicas</h2>
        <ul id="skills-list">
        </ul>
    </section>

    <section id="contact">
        <h2 data-i18n="contactTitle">Contato</h2>
        <form id="contact-form">
            <label for="name" data-i18n="labelName">Nome</label>
            <input type="text" id="name" name="name" data-i18n-placeholder="labelName" required>

            <label for="email" data-i18n="labelEmail">E-mail</label>
            <input type="email" id="email" name="email" data-i18n-placeholder="labelEmail" required>

            <label for="message" data-i18n="labelMessage">Mensagem</label>
            <textarea id="message" name="message" data-i18n-placeholder="labelMessage"></textarea>

            <button type="submit" data-i18n="btnSend">Enviar</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 - João Lucas Pinheiro | Engenharia de Software IFPR</p>
    <div id="api-content"></div>
</footer>

<script type="module" src="js/script.js"></script>
</body>
</html>
